<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e3f2e6"/><stop offset="100%" stop-color="#f1f8ee"/>
    </linearGradient>
    <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8bc34a"/><stop offset="100%" stop-color="#4b8b34"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="45%" stop-color="#c8e6c9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#a5d96a" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="60%" stop-color="#b2dfdb" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#81c784" stop-opacity=".55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#sky2)"/>
  <circle cx="220" cy="110" r="46" fill="#fdd835" opacity=".9"/>
  <circle cx="220" cy="110" r="120" fill="#fdd835" opacity=".12"/>

  <g fill="#ffffff" opacity=".8">
    <ellipse cx="1180" cy="110" rx="80" ry="30"/><ellipse cx="1245" cy="98" rx="56" ry="34"/>
    <ellipse cx="620" cy="70" rx="52" ry="20"/><ellipse cx="665" cy="62" rx="38" ry="24"/>
  </g>

  <path d="M0 300 L300 210 L520 300 L760 215 L1000 300 L1280 220 L1600 300 Z" fill="#a5d6a7" opacity=".55"/>
  <rect y="290" width="1600" height="310" fill="url(#gnd)"/>

  <!-- 温室大棚主体 -->
  <g>
    <path d="M120 470 L120 340 A260 260 0 0 1 640 340 L640 470 Z" fill="url(#glass)"/>
    <g stroke="#2e7d32" stroke-width="6" opacity=".55" fill="none">
      <path d="M120 340 A260 260 0 0 1 640 340"/>
      <path d="M250 250 L250 470"/><path d="M380 220 L380 470"/><path d="M510 250 L510 470"/>
      <path d="M120 400 L640 400"/>
    </g>
    <rect x="112" y="466" width="536" height="16" rx="8" fill="#33691e"/>
  </g>

  <!-- 第二个小棚 -->
  <g>
    <path d="M700 470 L700 380 A160 160 0 0 1 1020 380 L1020 470 Z" fill="url(#glass2)"/>
    <g stroke="#2e7d32" stroke-width="5" opacity=".5" fill="none">
      <path d="M700 380 A160 160 0 0 1 1020 380"/>
      <path d="M860 300 L860 470"/><path d="M700 425 L1020 425"/>
    </g>
    <rect x="694" y="466" width="332" height="14" rx="7" fill="#33691e"/>
  </g>

  <!-- 棚内蔬菜 -->
  <g fill="#f9a825">
    <circle cx="230" cy="440" r="14"/><circle cx="330" cy="452" r="12"/><circle cx="430" cy="440" r="14"/>
    <circle cx="530" cy="452" r="12"/>
  </g>
  <g fill="#e53935">
    <circle cx="800" cy="450" r="12"/><circle cx="920" cy="450" r="12"/>
  </g>

  <!-- 右侧粮仓 -->
  <g transform="translate(1200 250)">
    <path d="M0 220 L0 90 A110 110 0 0 1 220 90 L220 220 Z" fill="#f6e0b5"/>
    <path d="M0 90 A110 110 0 0 1 220 90 L220 120 L0 120 Z" fill="#e8c98d"/>
    <rect x="-8" y="216" width="236" height="16" rx="8" fill="#8d6e63"/>
    <rect x="86" y="150" width="48" height="66" rx="6" fill="#6d4c41"/>
    <g stroke="#c9a86a" stroke-width="4" opacity=".7">
      <path d="M20 150 L200 150"/><path d="M14 190 L206 190"/>
    </g>
  </g>

  <!-- 前景蔬菜 -->
  <g fill="#43a047" opacity=".95">
    <ellipse cx="120" cy="556" rx="46" ry="22"/><ellipse cx="1520" cy="548" rx="52" ry="24"/>
  </g>
  <g fill="#fdd835">
    <circle cx="120" cy="540" r="12"/><circle cx="1520" cy="532" r="13"/>
  </g>
</svg>

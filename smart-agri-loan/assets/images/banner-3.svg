<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b5e20"/><stop offset="55%" stop-color="#2e7d32"/><stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe082"/><stop offset="100%" stop-color="#f9a825"/>
    </linearGradient>
    <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#e8f5e9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#bg3)"/>

  <!-- 装饰圆 -->
  <g fill="#ffffff" opacity=".06">
    <circle cx="200" cy="130" r="150"/><circle cx="1450" cy="500" r="190"/><circle cx="820" cy="60" r="90"/>
  </g>

  <!-- 山丘 -->
  <path d="M0 420 Q260 330 520 420 T1050 420 T1600 400 L1600 600 L0 600 Z" fill="#1b5e20" opacity=".55"/>
  <path d="M0 500 Q400 430 800 500 T1600 480 L1600 600 L0 600 Z" fill="#14471f" opacity=".5"/>

  <!-- 数据柱状 -->
  <g transform="translate(150 250)" opacity=".9">
    <rect x="0" y="120" width="46" height="130" rx="10" fill="#a5d96a" opacity=".7"/>
    <rect x="70" y="80" width="46" height="170" rx="10" fill="#a5d96a" opacity=".85"/>
    <rect x="140" y="20" width="46" height="230" rx="10" fill="#fdd835"/>
    <path d="M-10 20 L165 -30" stroke="#ffffff" stroke-width="5" stroke-dasharray="14 12" fill="none" opacity=".65"/>
    <circle cx="163" cy="20" r="12" fill="#e53935"/>
  </g>

  <!-- 金币 -->
  <g transform="translate(1030 300)">
    <ellipse cx="90" cy="60" rx="120" ry="20" fill="#14471f" opacity=".35"/>
    <circle cx="60" cy="20" r="72" fill="url(#coin)"/>
    <circle cx="60" cy="20" r="56" fill="none" stroke="#f9a825" stroke-width="5" opacity=".7"/>
    <text x="60" y="42" font-size="58" font-weight="bold" text-anchor="middle" fill="#8d6e00" font-family="Arial">¥</text>
    <circle cx="176" cy="86" r="46" fill="url(#coin)" opacity=".9"/>
    <text x="176" y="102" font-size="34" font-weight="bold" text-anchor="middle" fill="#8d6e00" font-family="Arial">¥</text>
    <circle cx="-30" cy="96" r="34" fill="url(#coin)" opacity=".8"/>
  </g>

  <!-- 银行卡 -->
  <g transform="translate(880 90)">
    <rect x="0" y="0" width="300" height="180" rx="20" fill="url(#cardg)" opacity=".96"/>
    <rect x="0" y="0" width="300" height="52" rx="20" fill="#2e7d32"/>
    <rect x="0" y="38" width="300" height="16" fill="#2e7d32"/>
    <rect x="26" y="84" width="86" height="60" rx="10" fill="#fdd835"/>
    <g fill="#c8e6c9">
      <rect x="132" y="86" width="140" height="12" rx="6"/>
      <rect x="132" y="110" width="100" height="12" rx="6"/>
      <rect x="26" y="158" width="180" height="10" rx="5"/>
    </g>
  </g>

  <!-- 麦穗 -->
  <g transform="translate(1400 120)">
    <path d="M0 240 L0 40" stroke="#c9a86a" stroke-width="8" stroke-linecap="round"/>
    <g fill="#fdd835">
      <ellipse cx="-20" cy="40" rx="14" ry="30" transform="rotate(-22 -20 40)"/>
      <ellipse cx="20" cy="40" rx="14" ry="30" transform="rotate(22 20 40)"/>
      <ellipse cx="-20" cy="96" rx="14" ry="30" transform="rotate(-22 -20 96)"/>
      <ellipse cx="20" cy="96" rx="14" ry="30" transform="rotate(22 20 96)"/>
      <ellipse cx="0" cy="10" rx="15" ry="32"/>
    </g>
  </g>
  <g transform="translate(120 460)" opacity=".8">
    <path d="M0 140 L0 20" stroke="#c9a86a" stroke-width="7" stroke-linecap="round"/>
    <g fill="#ffe082">
      <ellipse cx="-16" cy="30" rx="12" ry="26" transform="rotate(-22 -16 30)"/>
      <ellipse cx="16" cy="30" rx="12" ry="26" transform="rotate(22 16 30)"/>
      <ellipse cx="0" cy="6" rx="13" ry="28"/>
    </g>
  </g>
</svg>

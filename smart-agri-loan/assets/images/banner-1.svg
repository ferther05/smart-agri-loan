<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9efe0"/>
      <stop offset="60%" stop-color="#eef8ee"/>
      <stop offset="100%" stop-color="#bfe0c4"/>
    </linearGradient>
    <linearGradient id="f1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec97f"/><stop offset="100%" stop-color="#3f9c46"/>
    </linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a5d96a"/><stop offset="100%" stop-color="#5aa63f"/>
    </linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cb85f"/><stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <radialGradient id="sun1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/><stop offset="100%" stop-color="#fdd835" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#sky1)"/>
  <circle cx="1330" cy="120" r="180" fill="url(#sun1)"/>
  <circle cx="1330" cy="120" r="52" fill="#fdd835" opacity=".95"/>

  <!-- 云 -->
  <g fill="#ffffff" opacity=".85">

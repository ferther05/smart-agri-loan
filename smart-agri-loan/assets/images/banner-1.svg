    <path d="M70 600 L100 470"/><path d="M140 600 L158 492"/>
  </g>
  <g fill="#fdd835">
    <ellipse cx="104" cy="452" rx="12" ry="26"/><ellipse cx="160" cy="474" rx="10" ry="22"/>
  </g>
</svg>

    <ellipse cx="780" cy="86" rx="60" ry="24"/><ellipse cx="830" cy="78" rx="44" ry="28"/>
  </g>

  <!-- 远山 -->
  <path d="M0 300 L190 190 L330 285 L470 175 L640 300 Z" fill="#8fc79b" opacity=".55"/>
  <path d="M980 300 L1150 195 L1310 280 L1470 200 L1600 290 L1600 300 Z" fill="#8fc79b" opacity=".45"/>

  <!-- 田野 -->
  <path d="M0 300 L1600 300 L1600 600 L0 600 Z" fill="url(#f1)"/>
  <path d="M0 380 L1600 360 L1600 600 L0 600 Z" fill="url(#f2)"/>
  <path d="M0 470 L1600 450 L1600 600 L0 600 Z" fill="url(#f3)"/>

  <!-- 田垄线条 -->
  <g stroke="#2b6b2f" stroke-opacity=".28" stroke-width="3" fill="none">

    <circle cx="470" cy="338" r="6"/><circle cx="620" cy="330" r="7"/><circle cx="900" cy="322" r="6"/>
    <circle cx="1080" cy="400" r="7"/><circle cx="1240" cy="394" r="6"/><circle cx="1420" cy="388" r="7"/>
  </g>

  <!-- 树 -->
  <g>
    <rect x="1500" y="330" width="14" height="60" rx="6" fill="#6d4c41"/>
    <circle cx="1507" cy="318" r="46" fill="#2e7d32"/>
    <circle cx="1478" cy="336" r="30" fill="#388e3c"/>
    <circle cx="1538" cy="336" r="30" fill="#43a047"/>
  </g>

  <!-- 无人机 -->
  <g transform="translate(1010 175)">
    <ellipse cx="0" cy="26" rx="90" ry="12" fill="#1b5e20" opacity=".16"/>
    <g stroke="#37474f" stroke-width="7" stroke-linecap="round">
      <path d="M-70 -14 L-22 4"/><path d="M70 -14 L22 4"/>
    </g>
    <g fill="#1b5e20">
      <ellipse cx="-78" cy="-22" rx="34" ry="9"/><ellipse cx="78" cy="-22" rx="34" ry="9"/>
    </g>
    <rect x="-30" y="-8" width="60" height="30" rx="12" fill="#2e7d32"/>
    <rect x="-22" y="2" width="44" height="10" rx="5" fill="#a5d96a"/>
    <circle cx="0" cy="24" r="8" fill="#fdd835"/>
    <g stroke="#81c784" stroke-width="5" stroke-linecap="round" stroke-dasharray="6 10">
      <path d="M-30 30 L-52 92"/><path d="M30 30 L52 92"/><path d="M0 32 L0 96"/>
